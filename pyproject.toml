[tool.poetry]
name = "drl-cox"
version = "0.1.0"
description = "Distributionally Robust Cox Regression with Wasserstein ambiguity, plus classical Cox baselines and evaluation utilities."
authors = ["Diogo Ribeiro <dfr@esmad.ipp.pt>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "drl_cox", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = "^2.3.4"
pandas = "^2.3.3"
cvxpy = "^1.7.3"
scipy = "^1.16.2"
joblib = "^1.5.2"
tqdm = "^4.67.1"
matplotlib = "^3.10.7"
seaborn = "^0.13.2"
scikit-optimize = "^0.10.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
ruff = "^0.14.1"
mypy = "^1.18.2"
matplotlib = "^3.10.7"
seaborn = "^0.13.2"

[tool.ruff]
line-length = 100
select = ["E","F","I","UP","B","ANN"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
strict = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

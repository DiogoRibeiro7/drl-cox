[tool.poetry]
name = "drl-cox"
version = "0.1.0"
description = "Distributionally Robust Cox Regression with Wasserstein ambiguity, plus classical Cox baselines and evaluation utilities."
authors = ["Diogo Ribeiro <dfr@esmad.ipp.pt>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "drl_cox", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "^2.0.0"
pandas = "^2.2.0"
cvxpy = "^1.5.2"
scipy = "^1.13.0"
joblib = "^1.3.0"
tqdm = "^4.66.0"
matplotlib = "^3.10.7"
seaborn = "^0.13.2"
scikit-optimize = "^0.10.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.14.0"
mypy = "^1.10.0"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"

[tool.ruff]
line-length = 100
select = ["E","F","I","UP","B","ANN"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
strict = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

site_name: DRL-Cox
site_description: Distributionally robust Cox regression with Wasserstein ambiguity sets.
site_url: https://diogoribeiro7.github.io/drl-cox/
repo_url: https://github.com/DiogoRibeiro7/drl-cox
repo_name: DiogoRibeiro7/drl-cox
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025-2026 Diogo Ribeiro. MIT licensed.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - Examples: examples.md
  - Scikit-learn API: sklearn_api.md
  - Parallel cross-validation: parallel_cv_optimization.md
  - API overview: api.md
  - API reference: reference.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

watch:
  - src/drl_cox

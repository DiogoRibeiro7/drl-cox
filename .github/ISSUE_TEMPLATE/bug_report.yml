name: Bug report
description: Something does not work as documented.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please fill in the sections below.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducible example
      description: The smallest script that reproduces the problem. It is rendered as Python automatically.
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback or output
      render: text
  - type: input
    id: version
    attributes:
      label: drl-cox version
      placeholder: "e.g. 0.1.0 (python -c 'import drl_cox; print(drl_cox.__version__)')"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g. Python 3.12.4, Windows 11, numpy 2.4.6, cvxpy 1.9.2, solver CLARABEL"
    validations:
      required: true

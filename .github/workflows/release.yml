name: Release

# Builds the wheel and sdist and creates a GitHub release (with the files
# attached) when a version tag such as v0.2.0 is pushed. The tag must match the
# version in pyproject.toml. The package is not published to PyPI; releases are
# archived on Zenodo through its GitHub integration.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  POETRY_VERSION: "2.2.1"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"

      - name: Verify that the tag matches the project version
        run: |
          version="$(poetry version --short)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag v$tag does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: poetry build

      - name: Check package metadata
        run: pipx run twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

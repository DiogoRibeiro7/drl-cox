name: Update Poetry Lock

on:
  push:
    paths:
      - 'pyproject.toml'
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'pyproject.toml'
    branches:
      - main
      - develop

jobs:
  update-poetry-lock:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'  # Adjust to your preferred Python version

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Update Poetry lock file
      run: poetry update

    - name: Check for changes in poetry.lock
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain poetry.lock)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit updated poetry.lock
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add poetry.lock
        git commit -m "chore: update poetry.lock after pyproject.toml changes"

    - name: Push changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}

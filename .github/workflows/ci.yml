name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.2.1"
  POETRY_CACHE_DIR: ${{ github.workspace }}/.poetry-cache
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint, format and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"

      - name: Cache Poetry downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.POETRY_CACHE_DIR }}
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry sync --no-interaction

      - name: Check that poetry.lock matches pyproject.toml
        run: poetry check --lock

      - name: Ruff (lint)
        run: poetry run ruff check --output-format=github .

      - name: Ruff (format)
        run: poetry run ruff format --check .

      - name: Mypy
        run: poetry run mypy

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        shell: bash
        run: pipx install "poetry==$POETRY_VERSION"

      - name: Cache Poetry downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.POETRY_CACHE_DIR }}
          key: poetry-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry sync --no-interaction

      - name: Run tests
        run: poetry run pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Smoke test
        shell: bash
        run: |
          poetry run python - <<'PY'
          from drl_cox import simulate_cox_data, fit_drl_cox
          data = simulate_cox_data(n=60, d=5, seed=0)
          result = fit_drl_cox(data, epsilon=0.05, p=2.0, gamma=2)
          assert result.status == "optimal", result.status
          print("ok")
          PY

  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"

      - name: Build sdist and wheel
        run: poetry build

      - name: Check package metadata
        run: pipx run twine check --strict dist/*

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          /tmp/venv/bin/python -c "import drl_cox; print(drl_cox.__version__)"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"

      - name: Install dependencies
        run: poetry sync --no-interaction --with docs

      - name: Build site (strict)
        run: poetry run mkdocs build --strict
